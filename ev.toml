# EV 默认配置。本地覆盖:复制为 ev.local.toml(已 gitignore)修改。
log_level = "INFO"

[audio]
sample_rate = 16000   # ASR/声纹统一 16kHz mono
channels = 1

# 帧级预处理: DC移除 → 预加重 → AGC → 噪声门. 远场友好参数.
[preprocess]
enabled = true
preemphasis_coeff = 0.97
agc_target_rms = 0.08       # 远场目标响度 (0.05 → 0.08, +4dBFS)
agc_min_gain = 0.1          # -20dB, 超大音量压限
agc_max_gain = 40.0         # +32dB, 覆盖 3m 远场 ~20dB 物理衰减
agc_attack_ms = 10.0        # 压缩快
agc_release_ms = 400.0      # 放大慢 4x, 防止句中停顿增益呼吸
noisegate_enabled = true
noisegate_snr_db = 1.5      # 远场 SNR 本就 2-5dB, 门槛过高会砍掉轻声 (3.0 → 1.5)
noisegate_floor_track_sec = 3.0

# VAD: FSMN 模型 + 能量兜底, 组合策略 start=OR end=AND+hangover
[vad]
# fsmn_threshold: 注释掉或不写 = 用 FunASR FSMN 默认阈值 (保守). 需要调的话设为 0.0~1.0 的浮点数
# fsmn_threshold = 0.3
energy_vad_enabled = true
energy_snr_linear = 1.8     # ~2.5dB, 远场轻声能触发 (2.5 → 1.8)
energy_abs_min_rms = 0.0003 # ~-70dBFS, 3m 轻声 ~-66dBFS 能进来 (0.001 → 0.0003)
energy_start_frames = 2     # 60ms
energy_hangover_frames = 20 # 600ms
combine_start_mode = "or"   # "or" / "fsmn_only" / "energy_only"
combine_end_mode = "and"    # "and" / "fsmn_only" / "energy_only"

[paths]
data_dir = "data"     # 相对项目根目录;存模型权重、语音存档、SQLite、日志

[models]
root = "data/models"
vad = "ev-fsmn-vad-zh-16k"
asr_streaming = "ev-paraformer-zh-streaming-16k"
asr_final = "ev-paraformer-zh-16k"
speaker = "ev-eres2netv2-zh-16k"

[speaker]
threshold = 0.40
max_core_samples = 20
max_cache_samples = 50
max_centroids = 3
loudness_normalize = true

[segment]
min_duration_ms = 500          # 短于此时长的段直接丢弃（咳嗽/敲击/噪声）
discard_filler_only = true     # 终稿仅为语气词时丢弃

[voice_learning]
auto_learn_enabled = true       # 正常使用中自动学习声纹
max_samples = 20               # 最多保留最近N个样本
ema_alpha = 0.05               # 新样本在EMA中的权重（0.05=5%）
collect_threshold_offset = 0.05 # 收录要求 score ≥ threshold + offset（高置信度）
collect_min_score = 0.60       # 自动学习收录最低分（高置信度，高于判定阈值）
onboarding_target = 5          # 手动引导录音次数，达到后才开启自动学习
min_duration_ms = 1500         # 样本最小时长（1.5秒）
max_duration_ms = 10000        # 样本最大时长（10秒）
min_interval_sec = 30          # 两次收录最小间隔（秒）

[vui]
wake_words = ["小E"]
