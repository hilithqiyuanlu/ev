<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Preview</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-background); font-family: var(--font-body); font-size: var(--font-size-body); color: var(--color-foreground); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { width: 92px; flex-shrink: 0; font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.02em; }
hr.divider { border: none; border-top: 1px solid var(--color-border); margin: 12px 0; }

/* @component-css-start */
/* Component definitions — extracted to components.css by deterministic script */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; cursor: pointer; font-family: var(--font-body); font-size: var(--font-size-body); font-weight: var(--font-weight-h4); line-height: 1; white-space: nowrap; transition: background .15s, border-color .15s, opacity .15s; flex-shrink: 0; }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.btn-capsule { background: rgba(120,120,128,.06); color: var(--color-foreground); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3); min-width: var(--size-button-md); height: var(--size-button-md); }
.btn-capsule:hover { filter: brightness(.95); }
.btn-capsule:active { opacity: .85; }
.btn-capsule-sm { padding: var(--space-1) var(--space-2); min-width: var(--size-button-sm); height: var(--size-button-sm); font-size: var(--font-size-caption); }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); min-width: var(--size-button-md); height: var(--size-button-md); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-primary:active { opacity: .9; }
.btn-borderless { background: transparent; color: var(--color-primary); border-radius: var(--radius-sm); padding: var(--space-1); min-width: var(--size-button-sm); height: var(--size-button-sm); }
.btn-borderless:hover { background: var(--color-surface-container); }
.btn-borderless:active { opacity: .85; }
.icon { width: 16px; height: 16px; flex-shrink: 0; }
/* @component-css-end */
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
  <symbol id="icon-stop" viewBox="0 0 24 24"><path d="M6 6h12v12H6z" fill="currentColor"/></symbol>
  <symbol id="icon-pencil" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></symbol>
</svg>

<div class="row"><span class="label">Capsule</span><button class="btn btn-capsule"><svg class="icon"><use href="#icon-play"/></svg>开始监听</button><button class="btn btn-capsule" disabled><svg class="icon"><use href="#icon-stop"/></svg>停止监听</button></div>
<div class="row"><span class="label">Capsule Small</span><button class="btn btn-capsule btn-capsule-sm">保存</button><button class="btn btn-capsule btn-capsule-sm" disabled>取消</button></div>
<hr class="divider">
<div class="row"><span class="label">Primary</span><button class="btn btn-primary">确认</button><button class="btn btn-primary" disabled>禁用</button></div>
<div class="row"><span class="label">Borderless</span><button class="btn btn-borderless" aria-label="编辑"><svg class="icon"><use href="#icon-pencil"/></svg></button><button class="btn btn-borderless" aria-label="删除"><svg class="icon"><use href="#icon-trash"/></svg></button><button class="btn btn-borderless" disabled aria-label="删除"><svg class="icon"><use href="#icon-trash"/></svg></button></div>
</body>
</html>
