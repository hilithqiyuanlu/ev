[project]
name = "ev"
version = "0.1.0"
description = "EV —— 个人语音助手(Phase 1a:ASR 转写 + 用户声纹门控)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "sounddevice>=0.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev"]

[tool.pytest.ini_options]
markers = [
    "models: requires the local models-v0.1.0 release and FunASR runtime",
]
